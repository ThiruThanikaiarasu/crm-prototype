openapi: 3.0.0
info:
  title: CRM Prototype API — Archive (fragment)
  version: 1.0.0
paths:
  /archive/leads/{id}:
    get:
      summary: Get archived lead by ID
      description: Returns a soft-deleted lead by its ID. Super Admin only.
      tags: [Archive]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{24}$"
          description: MongoDB ObjectId of the archived lead
      responses:
        '200':
          description: Archived lead retrieved successfully
          content:
            application/json:
              example:
                message: Archived lead retrieved successfully
                errorCode: null
                error: '0000'
                data:
                  _id: 695012cde2389e938f922ea0
                  status: new
                  deleted:
                    isDeleted: true
                    at: '2025-12-27T17:21:08.245Z'
                    by:
                      _id: 69217fc1d26c2d434bee1ae4
                      firstName: Thiru
                      lastName: T
                      email: thiru9@gmail.com
                      role: super_admin
        '400':
          description: Bad Request — invalid ObjectId format
          content:
            application/json:
              example:
                message: Invalid lead id
                errorCode: '1001'
                error: validation_error
                data: null
        '404':
          description: Archived lead not found
          content:
            application/json:
              example:
                message: Archived lead not found
                errorCode: '4201'
                error: not_found
                data: null
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal server error
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
